<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Loop - 실시간 자동 채점 & 오답노트 (v0.9.3)</title>
<style>
  :root{--bg:#fffef7;--card:#fff;--ink:#1b1b1b;--muted:#666;--line:#e8e2c8;--good:#0a7d2a;--bad:#b00020;--blue:#00a3ff;}
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,system-ui,sans-serif;margin:16px;background:var(--bg);color:var(--ink)}
  h1{font-size:20px;margin:0 0 6px}
  .sub{margin:0 0 14px;color:var(--muted);font-size:12px;line-height:1.45}
  .card{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--card)}
  textarea,input,button{font:inherit}
  textarea{width:100%;min-height:82px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fffdfa}
  button{border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px 12px}
  button:disabled{opacity:.5}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .muted{color:var(--muted);font-size:12px}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:#fff}
  .live{background:#fff3bf;border-color:#ffd43b}
  .good{color:var(--good);font-weight:800}
  .bad{color:var(--bad);font-weight:800}
  code{background:#fffbda;border:1px solid var(--line);padding:1px 6px;border-radius:8px}

  /* 핵심: video/overlay가 "같은 좌표계"를 쓰도록 고정 */
  .camWrap{
    position:relative;
    width:100%;
    height:52vh;              /* iPad에서도 좌표계가 안정적 */
    border-radius:12px;
    border:1px solid var(--line);
    background:#000;
    overflow:hidden;
  }
  video{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;         /* 보이는 화면과 동일하게 잘림 */
    display:block;
  }
  .overlay{position:absolute; inset:0; pointer-events:auto}

  .box{
    position:absolute;border:2px solid var(--blue);border-radius:10px;
    background:rgba(0,163,255,0.06);
    pointer-events:auto; touch-action:none;
  }
  .box.locked{border-style:dashed;opacity:0.92;pointer-events:none;}
  .box .label{
    position:absolute;top:-10px;left:-10px;background:var(--blue);color:#fff;
    border-radius:999px;padding:2px 8px;font-size:12px;border:1px solid rgba(255,255,255,.5)
  }
  .box .handle{
    position:absolute;right:-10px;bottom:-10px;width:22px;height:22px;border-radius:8px;
    background:var(--blue);border:2px solid rgba(255,255,255,.7)
  }

  .marker{
    position:absolute;width:14px;height:14px;border-radius:999px;
    border:2px solid #fff;background:rgba(0,163,255,.95);
    transform:translate(-50%,-50%);
    pointer-events:none;
  }
  .num{width:90px;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff}

  table{border-collapse:collapse;width:100%;font-size:14px;margin-top:8px}
  th,td{border:1px solid var(--line);padding:6px 8px;text-align:left}
  th{background:#fffbda}

  .thumbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}
  .thumb{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
  .thumb img{width:100%;display:block}
  .thumb .meta{padding:8px;font-size:12px;color:var(--muted)}
</style>
</head>

<body>
  <h1>Loop - 실시간 자동 채점 & 오답노트 <span class="pill">v0.9.3</span></h1>
  <p class="sub">처음 한 번만 “원 위치 설정(①→⑤)”을 하고, 이후에는 실시간 시작만 누르면 됩니다.</p>

  <div class="card">
    <h2 style="margin:0 0 8px">① 정답표</h2>
    <p class="muted">형식: <code>1:3 2:5 3:1</code></p>
    <textarea id="answerKey" placeholder="예) 1:3 2:5 3:1 4:2 5:4"></textarea>
    <div class="row" style="margin-top:6px">
      <button id="applyKey">정답표 적용</button>
      <button id="saveKey">저장</button>
      <button id="clearKey">지우기</button>
      <span id="keyStatus" class="muted"></span>
    </div>
  </div>

  <div class="card">
    <h2 style="margin:0 0 8px">② 카메라 & 가이드 박스</h2>
    <div class="row">
      <button id="startCam">카메라 켜기</button>
      <button id="toggleEdit" disabled>편집 모드: ON</button>
      <button id="saveBox" disabled>박스 저장</button>
      <button id="resetBox" disabled>박스 초기화</button>
      <button id="calibrate" disabled>원 위치 설정(①→⑤)</button>
      <button id="startLive" disabled>실시간 시작</button>
      <button id="stopLive" disabled>중지</button>
      <span id="status" class="pill">대기</span>
    </div>

    <div class="row" style="margin-top:8px">
      <span class="muted">현재 문제</span>
      <input id="qNum" class="num" type="number" min="1" value="1" />
      <button id="prevQ">이전</button>
      <button id="nextQ">다음</button>
      <span id="liveInfo" class="muted"></span>
    </div>

    <div class="camWrap" style="margin-top:10px">
      <video id="cam" playsinline muted></video>
      <div class="overlay" id="overlay"></div>
    </div>

    <div class="muted" style="margin-top:8px;line-height:1.5">
      박스는 ①②③④⑤ “한 줄”만 최대한 딱 맞게 잡아주세요.
    </div>
  </div>

  <div class="card">
    <h2 style="margin:0 0 8px">③ 채점 결과</h2>
    <div id="resultLine" class="muted">아직 결과가 없습니다.</div>
    <table id="resultTable" style="display:none">
      <thead><tr><th>문제</th><th>정답</th><th>내 답</th><th>결과</th></tr></thead>
      <tbody id="resultBody"></tbody>
    </table>
    <div class="row" style="margin-top:8px">
      <button id="clearResults">결과 지우기</button>
    </div>
  </div>

  <div class="card">
    <h2 style="margin:0 0 8px">④ 오답노트</h2>
    <div class="muted">틀린 문제는 자동 캡처되어 저장됩니다.</div>
    <div class="row" style="margin-top:8px">
      <button id="exportZip" disabled>ZIP 내보내기</button>
      <button id="clearWrong">오답 삭제</button>
      <span id="wrongStatus" class="muted"></span>
    </div>
    <div id="thumbs" class="thumbs"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<script>
const VERSION='v0.9.3';
const $=s=>document.querySelector(s);
const statusEl=$('#status');
function setStatus(text, live=false){
  statusEl.textContent=text;
  statusEl.classList.toggle('live', !!live);
}
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

/* 정답표 */
const answerKeyEl=$('#answerKey');
const applyKeyBtn=$('#applyKey');
const saveKeyBtn=$('#saveKey');
const clearKeyBtn=$('#clearKey');
const keyStatus=$('#keyStatus');
let answerKeyMap=new Map();

function normalizeChoice(x){
  if(!x) return null;
  const t=String(x).trim().toUpperCase();
  if(/^[1-5]$/.test(t)) return parseInt(t,10);
  if(t==='A') return 1; if(t==='B') return 2; if(t==='C') return 3; if(t==='D') return 4; if(t==='E') return 5;
  return null;
}
function parseAnswerKey(text){
  const map=new Map();
  const tokens=text.replace(/\n/g,' ').trim().split(/\s+/);
  for(const tok of tokens){
    const m=tok.match(/^(\d+)\s*[:\-\.]?\s*([A-E1-5])$/i);
    if(!m) continue;
    const q=parseInt(m[1],10);
    const choice=normalizeChoice(m[2]);
    if(choice) map.set(q, choice);
  }
  return map;
}
const savedKey=localStorage.getItem('loop_key_v093');
if(savedKey) answerKeyEl.value=savedKey;

applyKeyBtn.onclick=()=>{
  answerKeyMap=parseAnswerKey(answerKeyEl.value);
  keyStatus.textContent=`적용됨: ${answerKeyMap.size}개`;
  if(!answerKeyMap.size) alert('정답표 예시: 1:3 2:5');
};
saveKeyBtn.onclick=()=>{
  localStorage.setItem('loop_key_v093', answerKeyEl.value.trim());
  alert('저장했어요.');
};
clearKeyBtn.onclick=()=>{
  answerKeyEl.value='';
  localStorage.removeItem('loop_key_v093');
  answerKeyMap=new Map();
  keyStatus.textContent='';
};

/* 카메라/박스 */
const cam=$('#cam');
const overlay=$('#overlay');
const startCamBtn=$('#startCam');
const toggleEditBtn=$('#toggleEdit');
const saveBoxBtn=$('#saveBox');
const resetBoxBtn=$('#resetBox');
const calibrateBtn=$('#calibrate');
const startLiveBtn=$('#startLive');
const stopLiveBtn=$('#stopLive');
const liveInfo=$('#liveInfo');

const qNumEl=$('#qNum');
$('#prevQ').onclick=()=> qNumEl.value=Math.max(1,(parseInt(qNumEl.value,10)||1)-1);
$('#nextQ').onclick=()=> qNumEl.value=(parseInt(qNumEl.value,10)||1)+1;

let stream=null;
let editMode=true;

let choiceBox={x:0.08,y:0.65,w:0.84,h:0.22};
(function loadBox(){
  const s=localStorage.getItem('loop_box_v093');
  if(s){ try{ choiceBox=JSON.parse(s);}catch{} }
})();
function saveBox(){ localStorage.setItem('loop_box_v093', JSON.stringify(choiceBox)); }

/* ①~⑤ x 위치(박스 내부 0~1) */
let circleXs=null;
(function loadCircles(){
  const s=localStorage.getItem('loop_circles_v093');
  if(s){ try{ circleXs=JSON.parse(s);}catch{} }
})();
function saveCircles(){ localStorage.setItem('loop_circles_v093', JSON.stringify(circleXs)); }

function renderBoxAndMarkers(){
  overlay.innerHTML='';
  const wrap=overlay.getBoundingClientRect();

  const el=document.createElement('div');
  el.className='box'+(editMode?'':' locked');

  const label=document.createElement('div');
  label.className='label';
  label.textContent=editMode?'편집: 드래그/크기조절':'잠금';

  const handle=document.createElement('div');
  handle.className='handle';

  el.appendChild(label);
  el.appendChild(handle);
  overlay.appendChild(el);

  function applyPos(){
    const W=wrap.width, H=wrap.height;
    el.style.left=(choiceBox.x*W)+'px';
    el.style.top =(choiceBox.y*H)+'px';
    el.style.width =(choiceBox.w*W)+'px';
    el.style.height=(choiceBox.h*H)+'px';

    if(circleXs && Array.isArray(circleXs) && circleXs.length===5){
      for(let i=0;i<5;i++){
        const m=document.createElement('div');
        m.className='marker';
        const mx=(choiceBox.x + choiceBox.w*circleXs[i]) * W;
        const my=(choiceBox.y + choiceBox.h*0.5) * H;
        m.style.left=mx+'px';
        m.style.top =my+'px';
        overlay.appendChild(m);
      }
    }
  }
  applyPos();

  if(!editMode){
    window.addEventListener('resize', applyPos);
    return;
  }

  let dragging=false, resizing=false;
  let startX=0,startY=0,startBox=null;

  el.addEventListener('pointerdown',(e)=>{
    e.preventDefault();
    const rect=el.getBoundingClientRect();
    const isHandle=(e.clientX>rect.right-30 && e.clientY>rect.bottom-30);
    resizing=isHandle; dragging=!isHandle;
    startX=e.clientX; startY=e.clientY;
    startBox={...choiceBox};
    el.setPointerCapture(e.pointerId);
  });

  el.addEventListener('pointermove',(e)=>{
    if(!dragging && !resizing) return;
    const W=wrap.width,H=wrap.height;
    const dx=(e.clientX-startX)/W;
    const dy=(e.clientY-startY)/H;

    if(dragging){
      choiceBox.x=clamp(startBox.x+dx,0,1);
      choiceBox.y=clamp(startBox.y+dy,0,1);
    }else{
      choiceBox.w=clamp(startBox.w+dx,0.10,0.98);
      choiceBox.h=clamp(startBox.h+dy,0.06,0.60);
    }
    applyPos();
  });

  el.addEventListener('pointerup',()=>{ dragging=false; resizing=false; });
  window.addEventListener('resize', applyPos);
}
renderBoxAndMarkers();

toggleEditBtn.onclick=()=>{
  editMode=!editMode;
  toggleEditBtn.textContent='편집 모드: '+(editMode?'ON':'OFF');
  renderBoxAndMarkers();
};
saveBoxBtn.onclick=()=>{ saveBox(); alert('박스 저장 완료'); };
resetBoxBtn.onclick=()=>{ choiceBox={x:0.08,y:0.65,w:0.84,h:0.22}; renderBoxAndMarkers(); };

/* 카메라 시작 */
startCamBtn.onclick=async ()=>{
  try{
    stream=await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ideal:'environment'} }, audio:false });
    cam.srcObject=stream;

    await new Promise(res=>{ cam.onloadedmetadata=()=>res(); });
    await cam.play();

    toggleEditBtn.disabled=false;
    saveBoxBtn.disabled=false;
    resetBoxBtn.disabled=false;
    calibrateBtn.disabled=false;
    startLiveBtn.disabled=false;

    setStatus('카메라 준비됨');
    renderBoxAndMarkers();
  }catch(e){
    console.error(e);
    alert('카메라 권한을 허용해 주세요.');
  }
};

/* ===== 핵심 수정: “화면에 보이는 그대로(cover 크롭 포함)” 캔버스에 그리기 ===== */
function getDisplayFrameCanvas(){
  // 화면(=camWrap) 기준 좌표계를 그대로 캔버스로 만든다
  const cw = cam.clientWidth;
  const ch = cam.clientHeight;
  const vw = cam.videoWidth;
  const vh = cam.videoHeight;

  if(!cw || !ch || !vw || !vh) return null;

  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const canvas=document.createElement('canvas');
  canvas.width = Math.round(cw * dpr);
  canvas.height= Math.round(ch * dpr);

  const ctx=canvas.getContext('2d');
  ctx.imageSmoothingEnabled=true;

  // object-fit: cover와 동일한 크롭 계산
  const videoAR = vw / vh;
  const boxAR = cw / ch;

  let sx=0, sy=0, sw=vw, sh=vh;

  if(videoAR > boxAR){
    // 비디오가 더 넓음 -> 좌우 크롭
    sw = vh * boxAR;
    sx = (vw - sw) / 2;
  }else{
    // 비디오가 더 높음 -> 위아래 크롭
    sh = vw / boxAR;
    sy = (vh - sh) / 2;
  }

  ctx.drawImage(cam, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
  return canvas;
}

/* ===== 원 위치 설정(①→⑤) ===== */
let calibrating=false;
let calStep=0;

calibrateBtn.onclick=()=>{
  if(!cam.srcObject){ alert('먼저 카메라를 켜세요.'); return; }
  calibrating=true;
  calStep=0;
  circleXs=[];
  renderBoxAndMarkers();
  setStatus('원 위치 설정 중');
  liveInfo.textContent='①을 눌러주세요';
};

overlay.addEventListener('pointerdown',(e)=>{
  if(!calibrating) return;

  const wrap=overlay.getBoundingClientRect();
  const x=(e.clientX-wrap.left)/wrap.width;
  const y=(e.clientY-wrap.top)/wrap.height;

  const bx0=choiceBox.x, by0=choiceBox.y;
  const bx1=choiceBox.x+choiceBox.w, by1=choiceBox.y+choiceBox.h;

  if(x<bx0 || x>bx1 || y<by0 || y>by1){
    liveInfo.textContent='박스 안에서 눌러주세요';
    return;
  }

  const rx=(x-bx0)/(bx1-bx0);
  circleXs.push(clamp(rx,0,1));

  calStep++;
  if(calStep<5){
    liveInfo.textContent = `${['②','③','④','⑤'][calStep-1]}을 눌러주세요`;
  }else{
    circleXs.sort((a,b)=>a-b);
    saveCircles();
    calibrating=false;
    setStatus('원 위치 설정 완료');
    liveInfo.textContent='완료';
    renderBoxAndMarkers();
  }
});

/* ===== 검정 비율 계산 ===== */
function computeDarkRatioAt(frame, rx){
  const W=frame.width, H=frame.height;

  const bx=Math.round(choiceBox.x*W);
  const by=Math.round(choiceBox.y*H);
  const bw=Math.round(choiceBox.w*W);
  const bh=Math.round(choiceBox.h*H);

  // ROI만 따서 계산 (속도 + 정확도)
  const targetW=800;
  const s=Math.min(1, targetW/Math.max(1,bw));
  const tw=Math.max(320, Math.round(bw*s));
  const th=Math.max(140, Math.round(bh*s));

  const cut=document.createElement('canvas');
  cut.width=tw; cut.height=th;
  const ctx=cut.getContext('2d');
  ctx.drawImage(frame, bx, by, bw, bh, 0,0,tw,th);

  const img=ctx.getImageData(0,0,tw,th);
  const d=img.data;

  // 평균 밝기 기반 임계값
  let sum=0;
  const N=tw*th;
  for(let i=0;i<d.length;i+=4){
    sum += d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114;
  }
  const mean=sum/N;
  const thr=clamp(mean-35, 60, 190);

  const cx=Math.round(rx*tw);
  const winX=Math.round(tw*0.06);
  const x0=clamp(cx-winX,0,tw-1);
  const x1=clamp(cx+winX,0,tw-1);

  const y0=Math.round(th*0.20);
  const y1=Math.round(th*0.80);

  let dark=0, tot=0;
  for(let y=y0;y<y1;y++){
    for(let x=x0;x<=x1;x++){
      const idx=(y*tw+x)*4;
      const lum=d[idx]*0.299 + d[idx+1]*0.587 + d[idx+2]*0.114;
      if(lum < thr) dark++;
      tot++;
    }
  }
  return dark/Math.max(1,tot);
}

function pickChoice(frame){
  const xs=(circleXs && circleXs.length===5) ? circleXs : [0.10,0.30,0.50,0.70,0.90];
  const ratios=xs.map(rx=>computeDarkRatioAt(frame, rx));

  let best=0;
  for(let i=1;i<5;i++) if(ratios[i]>ratios[best]) best=i;

  const sorted=[...ratios].sort((a,b)=>b-a);
  const top=sorted[0], second=sorted[1];

  if(top < 0.18) return {choice:null, ratios};
  if(top < second + 0.06) return {choice:null, ratios};

  return {choice:best+1, ratios};
}

/* ===== 안정화 ===== */
let liveOn=false, busy=false;
let history=[];
const HISTORY_N=4;
const TICK_MS=320;

function stableUpdate(choice){
  if(choice){
    history.push(choice);
    if(history.length>HISTORY_N) history.shift();
  }else{
    history=[];
  }
  const ok=history.length===HISTORY_N && history.every(v=>v===history[0]);
  return ok ? history[0] : null;
}

/* 결과/오답/ZIP */
const resultLine=$('#resultLine');
const resultTable=$('#resultTable');
const resultBody=$('#resultBody');

$('#clearResults').onclick=()=>{
  gradedResults=new Map();
  resultBody.innerHTML='';
  resultTable.style.display='none';
  resultLine.textContent='아직 결과가 없습니다.';
};

const exportZipBtn=$('#exportZip');
$('#clearWrong').onclick=()=>{
  wrongItems=[];
  localStorage.removeItem('loop_wrong_v093');
  refreshWrongUI();
};

let gradedResults=new Map();
let wrongItems=[];

function refreshWrongUI(){
  const thumbsEl=$('#thumbs');
  const wrongStatus=$('#wrongStatus');
  thumbsEl.innerHTML='';
  wrongItems.forEach(item=>{
    const card=document.createElement('div');
    card.className='thumb';
    const img=document.createElement('img');
    img.src=item.dataUrl;
    const meta=document.createElement('div');
    meta.className='meta';
    meta.innerHTML=`Q${item.q} • 정답 ${item.correct} • 내 답 ${item.my} • <span class="bad">❌</span>`;
    card.appendChild(img); card.appendChild(meta);
    thumbsEl.appendChild(card);
  });
  exportZipBtn.disabled = wrongItems.length===0;
  wrongStatus.textContent = wrongItems.length ? `오답 ${wrongItems.length}개 저장됨` : '';
}
(function loadWrong(){
  const s=localStorage.getItem('loop_wrong_v093');
  if(s){ try{ wrongItems=JSON.parse(s)||[]; }catch{} }
  refreshWrongUI();
})();
function saveWrong(){ try{ localStorage.setItem('loop_wrong_v093', JSON.stringify(wrongItems)); }catch{} }

function renderResult(q, correct, my, ok, frame){
  gradedResults.set(q,{correct,my,ok});

  resultBody.innerHTML='';
  const entries=Array.from(gradedResults.entries()).sort((a,b)=>a[0]-b[0]);
  for(const [qn,r] of entries){
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${qn}</td><td>${r.correct}</td><td>${r.my}</td><td class="${r.ok?'good':'bad'}">${r.ok?'✅':'❌'}</td>`;
    resultBody.appendChild(tr);
  }
  resultTable.style.display='table';
  resultLine.innerHTML=`Q${q} • 정답 ${correct} • 내 답 ${my} • <span class="${ok?'good':'bad'}">${ok?'✅ 정답':'❌ 오답'}</span>`;

  if(!ok){
    const already=wrongItems.some(it=>it.q===q);
    if(!already){
      const dataUrl=frame.toDataURL('image/jpeg',0.85);
      wrongItems.push({q,correct,my,dataUrl});
      saveWrong();
      refreshWrongUI();
    }
  }
}

exportZipBtn.onclick=async ()=>{
  if(!wrongItems.length){ alert('오답이 없습니다.'); return; }
  const zip=new JSZip();
  const lines=['question,correct,my'];
  wrongItems.forEach(it=>lines.push(`${it.q},${it.correct},${it.my}`));
  zip.file('wrong_list.csv', lines.join('\n'));
  zip.file('choice_box.json', JSON.stringify(choiceBox,null,2));
  zip.file('circle_positions.json', JSON.stringify(circleXs,null,2));
  zip.file('answer_key.txt', answerKeyEl.value.trim());
  zip.file('version.txt', VERSION);

  const folder=zip.folder('wrong_images');
  for(const it of wrongItems){
    const base64=it.dataUrl.split(',')[1];
    folder.file(`Q${String(it.q).padStart(3,'0')}_wrong.jpg`, base64, {base64:true});
  }

  const blob=await zip.generateAsync({type:'blob'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`Loop_wrongnotes_${Date.now()}.zip`;
  a.click();
  URL.revokeObjectURL(url);
};

/* LIVE */
async function tick(){
  if(!liveOn) return;
  if(busy){ setTimeout(tick,120); return; }
  busy=true;

  try{
    const frame=getDisplayFrameCanvas();
    if(!frame){
      setStatus('카메라 준비 중…', true);
      liveInfo.textContent=`video ${cam.videoWidth||0}x${cam.videoHeight||0} / view ${cam.clientWidth||0}x${cam.clientHeight||0}`;
      setTimeout(tick,200);
      return;
    }

    const q=parseInt(qNumEl.value,10)||1;
    const correct=answerKeyMap.get(q)||null;

    const {choice, ratios}=pickChoice(frame);
    const final=stableUpdate(choice);

    const r=ratios.map(v=>v.toFixed(2)).join(' ');
    if(final) liveInfo.textContent=`내 답 확정: ${final} (검정비율 ${r})`;
    else if(choice) liveInfo.textContent=`감지 중: ${choice} (검정비율 ${r})`;
    else liveInfo.textContent=`감지 중... (검정비율 ${r})`;

    if(final && correct){
      const ok=(final===correct);
      const prev=gradedResults.get(q);
      if(!prev || prev.my!==final){
        renderResult(q, correct, final, ok, frame);
      }
    }

    setStatus('LIVE ON', true);
  }catch(e){
    console.error(e);
    setStatus('에러', true);
    liveInfo.textContent='감지 실패(박스/초점/조명 확인)';
  }finally{
    busy=false;
    setTimeout(tick, TICK_MS);
  }
}

startLiveBtn.onclick=()=>{
  if(!cam.srcObject){ alert('먼저 카메라를 켜주세요.'); return; }
  if(!answerKeyMap.size){ alert('먼저 정답표 적용을 눌러 주세요.'); return; }
  if(!circleXs || circleXs.length!==5){ alert('처음 한 번만 “원 위치 설정(①→⑤)”을 해주세요.'); return; }
  if(calibrating){ alert('원 위치 설정을 먼저 끝내주세요.'); return; }

  liveOn=true;
  editMode=false;
  toggleEditBtn.textContent='편집 모드: OFF';
  renderBoxAndMarkers();

  startLiveBtn.disabled=true;
  stopLiveBtn.disabled=false;
  history=[];

  setStatus('LIVE ON', true);
  tick();
};

stopLiveBtn.onclick=()=>{
  liveOn=false;
  setStatus('중지');
  startLiveBtn.disabled=false;
  stopLiveBtn.disabled=true;
  history=[];
};

window.addEventListener('beforeunload', ()=>{
  if(stream) stream.getTracks().forEach(t=>t.stop());
});
</script>
